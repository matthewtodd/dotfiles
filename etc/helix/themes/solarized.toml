"attribute" = { fg = "light-magenta" }
"keyword" = { fg = "green" }
"keyword.directive" = { fg = "light-red" }
"namespace" = { fg = "light-magenta" }
"operator" = { fg = "green" }
"special" = { fg = "light-red" }
"variable.builtin" = { fg = "cyan", modifiers = ["bold"] }
"variable.function" = { fg = "blue" }
"type" = { fg = "yellow" }
"type.builtin" = { fg = "yellow", modifiers = ["bold"] }
"constructor" = { fg = "blue" }
"function" = { fg = "blue" }
"function.macro" = { fg = "magenta" }
"function.builtin" = { fg = "blue", modifiers = ["bold"] }
"function.special" = { fg = "magenta" }
"comment" = { fg = "light-cyan" }
"string" = { fg = "cyan" }
"constant" = { fg = "cyan" }
"constant.builtin" = { fg = "cyan", modifiers = ["bold"] }
"constant.character.escape" = { fg = "red", modifiers = ["bold"] }
"label" = { fg = "green" }
"module" = { fg = "light-magenta" }
"tag" = { fg = "magenta" }

# TODO
"markup.heading" = "blue"
"markup.list" = "red"
"markup.bold" = { fg = "yellow", modifiers = ["bold"] }
"markup.italic" = { fg = "magenta", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "yellow", modifiers = ["underlined"] }
"markup.link.text" = "red"
"markup.quote" = "cyan"
"markup.raw" = "green"

"diff.plus" = { fg = "green" }
"diff.delta" = { fg = "light-red" }
"diff.minus" = { fg = "red" }

# 背景
# background
"ui.background" = { bg = "white" }

"ui.virtual.whitespace" = { fg = "light-cyan" }
"ui.virtual.inlay-hint" = { fg = "light-cyan", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

# 行号栏
# line number column
"ui.linenr" = { fg = "light-yellow", bg = "light-gray" }
# 当前行号栏
# current line number column
"ui.linenr.selected" = { fg = "blue", modifiers = ["bold"] }
# cursorline
"ui.cursorline" = { bg = "light-yellow" }

# 状态栏
# status bar
"ui.statusline" = { fg = "white", bg = "light-yellow" }
"ui.statusline.normal" = { bg = "blue" }
"ui.statusline.insert" = { bg = "green" }
"ui.statusline.select" = { bg = "yellow" }

# 非活动状态栏
# inactive status bar
"ui.statusline.inactive" = { fg = "light-green", bg = "light-cyan" }

# 补全窗口, preview窗口
# Completion window, preview window
"ui.popup" = { bg = "light-gray" }
# 影响 补全选中 cmd弹出信息选中
# Affect completion selection, cmd pop-up information selection
"ui.menu.selected" = { fg = "light-gray", bg = "black"}
"ui.menu" = { fg = "light-yellow", bg = "light-gray" }
# ??
"ui.window" = { fg = "gray" }
# 命令行 补全的帮助信息
# Command line completion help information
"ui.help" = { modifiers = ["reversed"] }

# 快捷键窗口 
# Shortcut window
"ui.popup.info" = { bg = "light-green" }
# 快捷键字体
# Shortcut font
"ui.text.info" = {fg = "light-gray", modifiers = ["bold"]}

# 普通ui的字体样式
# Normal ui font style
"ui.text" = { fg = "light-green" }
# 影响 picker列表选中, 快捷键帮助窗口文本
# Affects picker list selection, shortcut key help window text
"ui.text.focus" = { fg = "blue", modifiers = ["bold"]}

# 主光标/selection
# main cursor/selection
"ui.cursor.primary" = { fg = "white", bg = "light-green" }
"ui.cursor.select" = { fg = "light-gray", bg = "cyan" }

"ui.cursorline.primary" = { bg = "light-gray" }
"ui.cursorline.secondary" = { bg = "white" }

"ui.selection" = { bg = "light-gray" }
"ui.selection.primary" = { bg = "light-cyan" }

"ui.virtual.indent-guide" = { fg = "light-gray" }
"ui.virtual.ruler" = { bg = "light-gray" }

# normal模式的光标
# normal mode cursor
"ui.cursor" = {fg = "light-gray", bg = "cyan"}
"ui.cursor.insert" = {fg = "white", bg = "gray"}
# 当前光标匹配的标点符号
# The punctuation character matched by the current cursor
"ui.cursor.match" = { fg = "light-gray", bg = "light-cyan" }

"warning" =  { fg = "light-red", modifiers= ["bold", "underlined"] }
"error" = { fg = "red", modifiers= ["bold", "underlined"] }
"info" = { fg = "blue", modifiers= ["bold", "underlined"] }
"hint" = { fg = "light-cyan", modifiers= ["bold", "underlined"] }

"diagnostic.warning" = { underline = { style = "curl", color = "light-red" } }
"diagnostic.error" = { underline = { style = "curl", color = "red" } }
"diagnostic.info" = { underline = { style = "curl", color = "blue" } }
"diagnostic.hint" = { underline = { style = "curl", color = "light-cyan" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
