[colors]
"error" = { fg = "default", bold = true }
"error_source" = { fg = "default" }
"warning" = { fg = "default", bold = true }
"hint" = { fg = "default" }
"error heading" = { fg = "red", bold = true }
"error_source heading" = { bold = true }
"warning heading" = { fg = "yellow", bold = true }
"hint heading" = { fg = "cyan", bold = true }

"conflict_description" = "yellow"
"conflict_description difficult" = "red"

"commit_id" = "blue"
"change_id" = "magenta"

# Unique prefixes and the rest for change & commit ids
"prefix" = { bold = true }
"rest" = "black"
"mutable divergent rest" = "red"
"mutable divergent prefix" = { fg = "red", underline = true }
"hidden prefix" = "default"

"author" = "yellow"
"committer" = "yellow"
"timestamp" = "cyan"
"working_copies" = "green"
"bookmark" = "magenta"
"bookmarks" = "magenta"
"local_bookmarks" = "magenta"
"remote_bookmarks" = "magenta"
"tag" = "magenta"
"tags" = "magenta"
"git_ref" = "green"
"git_refs" = "green"
"git_head" = "green"
"mutable divergent" = "red"
"mutable divergent change_id" = "red"
"conflict" = "red"
"empty" = "green"
"placeholder" = "red"
"description placeholder" = "yellow"
"empty description placeholder" = "green"
"separator" = "black"
"elided" = "black"
"root" = "green"

"working_copy" = { bold = true }
"working_copy commit_id" = "blue"
"working_copy change_id" = "magenta"
# We do not use bright yellow because of how it looks on xterm's default theme.
# https://github.com/jj-vcs/jj/issues/528
"working_copy author" = "yellow"
"working_copy committer" = "yellow"
"working_copy timestamp" = "cyan"
"working_copy working_copies" = "green"
"working_copy bookmark" = "magenta"
"working_copy bookmarks" = "magenta"
"working_copy local_bookmarks" = "magenta"
"working_copy remote_bookmarks" = "magenta"
"working_copy tag" = "magenta"
"working_copy tags" = "magenta"
"working_copy git_ref" = "green"
"working_copy git_refs" = "green"
"working_copy mutable divergent" = "red"
"working_copy mutable divergent change_id" = "red"
"working_copy conflict" = "red"
"working_copy empty" = "green"
"working_copy placeholder" = "red"
"working_copy description placeholder" = "yellow"
"working_copy empty description placeholder" = "green"

"config_list name" = "green"
"config_list value" = "yellow"
"config_list source" = "blue"
"config_list path" = "magenta"
"config_list overridden" = "black"
"config_list overridden name" = "black"
"config_list overridden value" = "black"
"config_list overridden source" = "black"
"config_list overridden path" = "black"

"diff header" = "yellow"
"diff empty" = "cyan"
"diff binary" = "cyan"
"diff file_header" = { bold = true }
"diff hunk_header" = "cyan"
"diff removed" = { fg = "red" }
"diff added" = { fg = "green" }
"diff token" = { underline = true }
"diff modified" = "cyan"
"diff untracked" = "magenta"
"diff renamed" = "cyan"
"diff copied" = "green"
"diff access-denied" = { bg = "red" }

"operation id" = "blue"
"operation user" = "yellow"
"operation time" = "cyan"
"operation tags" = "magenta"
"operation current_operation" = { bold = true }
"operation current_operation id" = "blue"
"operation current_operation user" = "yellow"                    # No bright yellow, see comment above
"operation current_operation time" = "cyan"
"operation current_operation tags" = "magenta"

"node elided" = { fg = "black" }
"node working_copy" = { fg = "green", bold = true }
"node current_operation" = { fg = "green", bold = true }
"node immutable" = { fg = "cyan", bold = true }
"node conflicted" = { fg = "red", bold = true }

"signature display" = "yellow"
"signature key" = "cyan"
"signature status good" = "green"
"signature status unknown" = "yellow"
"signature status bad" = "red"
"signature status invalid" = "red"
